{% extends "base.html" %}

{% block title %}Entrar | Blog{% endblock %}

{% block content %}
  <section class="cartao">
    <h1>Entrar</h1>
    <form method="post" action="{% url 'contas:entrar' %}">
      {% csrf_token %}
      {{ form }}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button type="submit">Entrar</button>
    </form>
  </section>
{% endblock %}
