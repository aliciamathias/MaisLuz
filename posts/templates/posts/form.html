{% extends "base.html" %}

{% block title %}{{ titulo_pagina }} | Blog{% endblock %}

{% block content %}
  <section class="cartao">
    <h1>{{ titulo_pagina }}</h1>
    <form method="post">
      {% csrf_token %}
      {{ form }}
      <div class="acoes">
        <button type="submit">Salvar</button>
        <a href="{% url 'posts:painel' %}">Cancelar</a>
      </div>
    </form>
  </section>
{% endblock %}
